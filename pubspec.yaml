name: pickup_table
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.10.261027+26102701

environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  video_player: ^2.7.2
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.0.0
  ml_linalg: ^13.12.7
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  mqtt_client: ^10.9.0
  dio: ^5.9.2
  csv: ^6.0.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  injectable_generator: ^2.9.1
  freezed: ^3.2.3

# Both pinned below minSdk=24+ versions that conflict with this fleet's
# org-wide minSdk=23 floor (the oldest device, an Android 6 FrameTV, needs
# 23) — until either the fleet's minSdk floor moves up or these plugins
# backport a minSdk-23-compatible release.
# - path_provider_android 2.2.20+ raised minSdk to 24; 2.2.19 (same version
#   flowhub resolves to) is still 21.
# - shared_preferences_android 2.4.14+ raised minSdk to 24 (confirmed via
#   its own android/build.gradle in the pub cache); 2.4.13 (same version
#   CafeBeta-Kiosk resolves to) is still 21.
# - video_player_android 2.9.0+ raised minSdk to 24; 2.8.15 is still 21.
dependency_overrides:
  path_provider_android: 2.2.19
  shared_preferences_android: 2.4.13
  video_player_android: 2.8.15

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/videos/PickupTable-backgroundVideo.mp4
    - assets/images/cafe_beta.png
    - assets/images/drink.png
    - assets/images/food.png
    - assets/images/bottle.png
    - assets/images/bg.png
    - assets/images/bg-object.png
    - assets/images/bg-hand.png
    - assets/images/menu-image.png
    - assets/images/tech-image.png
    - assets/images/loop-menu-image-1.png
    - assets/images/loop-menu-image-2.png
    - assets/images/loop-menu-image-3.png


  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/GOTHIC.ttf
          weight: 400
        - asset: assets/fonts/GOTHICB.ttf
          weight: 700
    # Per-language customer-facing text (pickup message, nickname) — see
    # AppConstants.fontFamilyForLanguage. en/ko/ja/zh each get their own
    # LINE Seed variant; Chinese uses MiSans instead (LINE Seed has no zh cut).
    - family: LineSeedEN
      fonts:
        - asset: assets/fonts/LINESeedSans_A_Th.otf
          weight: 100
        - asset: assets/fonts/LINESeedSans_A_Rg.otf
          weight: 400
        - asset: assets/fonts/LINESeedSans_A_Bd.otf
          weight: 700
        - asset: assets/fonts/LINESeedSans_A_He.otf
          weight: 800
        - asset: assets/fonts/LINESeedSans_A_XBd.otf
          weight: 900
    - family: LineSeedKR
      fonts:
        - asset: assets/fonts/LINESeedKR-Th.otf
          weight: 100
        - asset: assets/fonts/LINESeedKR-Rg.otf
          weight: 400
        - asset: assets/fonts/LINESeedKR-Bd.otf
          weight: 700
    - family: LineSeedJP
      fonts:
        - asset: assets/fonts/LINESeedJP_A_OTF_Th.otf
          weight: 100
        - asset: assets/fonts/LINESeedJP_A_OTF_Rg.otf
          weight: 400
        - asset: assets/fonts/LINESeedJP_A_OTF_Bd.otf
          weight: 700
        - asset: assets/fonts/LINESeedJP_A_OTF_Eb.otf
          weight: 800
    - family: MiSans
      fonts:
        # Flutter only accepts weight values in multiples of 100 — MiSans
        # ships 10 cuts but only 9 such slots exist, so Normal/Demibold
        # (near-duplicates of Regular/Semibold) are left out.
        - asset: assets/fonts/MiSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/MiSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/MiSans-Light.ttf
          weight: 300
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/MiSans-Heavy.ttf
          weight: 900
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
