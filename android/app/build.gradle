plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// 키스토어 설정 로드
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.soundgraph.flow.pickuptable"
    compileSdk 36 // 라이브러리 호환용
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.soundgraph.flow.pickuptable"
        // Org-wide standard value — 23 covers the oldest device in the
        // fleet (Android 6 FrameTV); the 160T unit runs Android 16, so the
        // whole fleet's range is 23-36.
        minSdkVersion 23
        targetSdk 33    // Android 11(API 30) 최적화 타겟 (35에서 하향 조정 추천)

        // [추가] 64비트 전용 빌드로 메모리 효율 극대화
        ndk {
            abiFilters 'arm64-v8a'
        }
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Same dev/prod split as CafeBeta-Kiosk (android/app/build.gradle.kts)
    // — a dev build gets its own applicationId (installable side-by-side
    // with prod) and app name, driven by main_dev.dart/main_prod.dart.
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Cafe Beta PickupTable Dev"
        }
        prod {
            dimension "env"
            resValue "string", "app_name", "Cafe Beta PickupTable"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    // Renames the output APK from Flutter's default (app-dev-release.apk /
    // app-prod-release.apk) to
    // CafeBeta_PickupTable_<versionName>.<versionCode, zero-padded>-<flavor>.apk
    // — see flowhub/android/app/build.gradle.kts for the fleet-wide
    // convention this mirrors (A.BC.MMDD versionName + NN versionCode, both
    // from pubspec.yaml, bumped by hand before each build). versionName
    // already carries flavor's own "-dev" suffix (see productFlavors
    // above), so this only adds the flavor name itself for prod builds.
    // Uses the older applicationVariants API (not androidComponents.
    // onVariants) — the newer Variant API's `output.outputFileName` didn't
    // resolve against this project's AGP version.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName =
                "CafeBeta_PickupTable_${variant.versionName}.${variant.versionCode.toString().padLeft(2, '0')}-${variant.flavorName}.apk"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}
